name: matgar

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Matgar@12345}
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # Env vars override appsettings.Docker.json (precedence).
      # Required values come from .env; the compose file refuses to start if
      # DB_CONNECTION_STRING or JWT_SIGNING_KEY are missing.
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?-set DB_CONNECTION_STRING in .env}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      JwtOptions__Key: ${JWT_SIGNING_KEY:?-set JWT_SIGNING_KEY in .env}
      EmailOptions__Email: ${EMAIL_ADDRESS:-}
      EmailOptions__Password: ${EMAIL_APP_PASSWORD:-}
    ports:
      - "5203:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
  redis-data: